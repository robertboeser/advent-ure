name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Graph prüfen
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Balancing
        run: npm run simulate
